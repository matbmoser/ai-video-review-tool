[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-review-tool"
dynamic = ["version"]
description = "Frame-accurate review notes for AI-generated videos, saved in a format Claude and other AI agents can implement."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mathias Brunkow Moser" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["video", "review", "remotion", "claude", "ai", "annotation", "feedback"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/matbmoser/ai-video-review-tool"
Issues = "https://github.com/matbmoser/ai-video-review-tool/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
video-review = "video_review.cli:main"

[tool.setuptools.dynamic]
version = { attr = "video_review.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_review = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "A"]
ignore = []
